name: Verificar presença dos secrets WhatsApp

# Verificação manual na main; acessar o environment pode exigir aprovação.
on:
  workflow_dispatch:
    inputs:
      confirm_presence:
        description: Confirmo a verificação de presença no environment de homologação
        type: boolean
        required: true
        default: false

permissions: {}

concurrency:
  group: verificar-secrets-whatsapp
  cancel-in-progress: false

jobs:
  presenca:
    if: github.repository == 'comeca-ai/projeto_tribureembolsa' && github.ref == 'refs/heads/main' && inputs.confirm_presence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: homologacao
    permissions: {}
    steps:
      - name: Configurar Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Verificar somente presença, sem imprimir valores
        env:
          DIALOG_360_API_KEY: ${{ secrets.DIALOG_360_API_KEY }}
          DIALOG_360_WEBHOOK_SECRET: ${{ secrets.DIALOG_360_WEBHOOK_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const present = {
            DIALOG_360_API_KEY: Boolean(process.env.DIALOG_360_API_KEY?.trim()),
            DIALOG_360_WEBHOOK_SECRET: Boolean(process.env.DIALOG_360_WEBHOOK_SECRET?.trim()),
          };
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `DIALOG_360_API_KEY: ${present.DIALOG_360_API_KEY ? 'configurado' : 'ausente'}\n\n` +
            `DIALOG_360_WEBHOOK_SECRET: ${present.DIALOG_360_WEBHOOK_SECRET ? 'configurado' : 'ausente'}\n\n` +
            'Checagem de presença apenas. Nenhuma chamada à 360dialog ou alteração no servidor.\n');
          if (!Object.values(present).every(Boolean)) process.exit(1);
          NODE
