name: Verificar presença dos secrets WhatsApp

# Verificação manual na main; acessar o environment pode exigir aprovação.
on:
  workflow_dispatch:
    inputs:
      confirm_presence:
        description: Confirmo a verificação de presença no environment de homologação
        type: boolean
        required: true
        default: false

permissions: {}

concurrency:
  group: verificar-secrets-whatsapp
  cancel-in-progress: false

jobs:
  presenca:
    if: github.repository == 'comeca-ai/projeto_tribureembolsa' && github.ref == 'refs/heads/main' && inputs.confirm_presence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: homologacao
    permissions: {}
    steps:
      - name: Configurar Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Verificar somente presença, sem imprimir valores
        env:
          API_KEY: ${{ secrets.API_KEY }}
          URL_API_MENSAGENS: ${{ secrets.URL_API_MENSAGENS }}
          DIALOG_360_WEBHOOK_SECRET: ${{ secrets.DIALOG_360_WEBHOOK_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const present = {
            API_KEY: Boolean(process.env.API_KEY?.trim()),
            URL_API_MENSAGENS: Boolean(process.env.URL_API_MENSAGENS?.trim()),
            DIALOG_360_WEBHOOK_SECRET: Boolean(process.env.DIALOG_360_WEBHOOK_SECRET?.trim()),
          };
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `API_KEY: ${present.API_KEY ? 'configurado' : 'ausente'}\n\n` +
            `URL_API_MENSAGENS: ${present.URL_API_MENSAGENS ? 'configurado' : 'ausente'} (endereço informado; o código usa endpoints fixos)\n\n` +
            `DIALOG_360_WEBHOOK_SECRET: ${present.DIALOG_360_WEBHOOK_SECRET ? 'configurado' : 'ausente'} (configuração própria do receptor, não fornecida pela 360dialog)\n\n` +
            'Checagem de presença apenas. Nenhuma chamada à 360dialog ou alteração no servidor.\n');
          if (!present.API_KEY) process.exit(1);
          NODE
