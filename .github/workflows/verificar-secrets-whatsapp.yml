name: Verificar presença dos secrets WhatsApp

on:
  push:
    branches: [docs/360dialog-canal-unico]
    paths: [.github/workflows/verificar-secrets-whatsapp.yml]
  workflow_dispatch:

permissions: {}

concurrency:
  group: verificar-secrets-whatsapp
  cancel-in-progress: false

jobs:
  presenca:
    if: github.repository == 'comeca-ai/projeto_tribureembolsa' && github.ref == 'refs/heads/docs/360dialog-canal-unico'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api_key: ${{ steps.verificar.outputs.api_key }}
      webhook: ${{ steps.verificar.outputs.webhook }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verificar somente presença, sem imprimir valores
        id: verificar
        env:
          DIALOG_360_API_KEY: ${{ secrets.DIALOG_360_API_KEY }}
          DIALOG_360_WEBHOOK_SECRET: ${{ secrets.DIALOG_360_WEBHOOK_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const apiKey = Boolean(process.env.DIALOG_360_API_KEY?.trim());
          const webhook = Boolean(process.env.DIALOG_360_WEBHOOK_SECRET?.trim());
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `api_key=${apiKey}\nwebhook=${webhook}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `DIALOG_360_API_KEY: ${apiKey ? 'configurado' : 'ausente'}\n\n` +
            `DIALOG_360_WEBHOOK_SECRET: ${webhook ? 'configurado' : 'ausente'}\n\n` +
            'Checagem de presença apenas. Nenhuma chamada à 360dialog ou alteração no servidor.\n');
          NODE

  registrar:
    needs: presenca
    if: github.repository == 'comeca-ai/projeto_tribureembolsa' && github.ref == 'refs/heads/docs/360dialog-canal-unico'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Este job não recebe as credenciais 360dialog, somente dois booleanos.
      - name: Registrar resultado sem valores, hashes ou fragmentos de secrets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_KEY_PRESENT: ${{ needs.presenca.outputs.api_key }}
          WEBHOOK_PRESENT: ${{ needs.presenca.outputs.webhook }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const repo = 'comeca-ai/projeto_tribureembolsa';
          const branch = 'docs/360dialog-canal-unico';
          const file = 'docs/whatsapp-poc/secrets-actions-status.json';
          assert.equal(process.env.GITHUB_REPOSITORY, repo);
          assert.equal(process.env.GITHUB_REF, `refs/heads/${branch}`);
          assert.equal(process.env.GITHUB_ACTIONS, 'true');
          function flag(value) {
            assert(['true', 'false'].includes(value), 'Resultado de presença inválido');
            return value === 'true';
          }
          const report = {
            verification: 'presence_only',
            sourceCommit: process.env.GITHUB_SHA,
            run: `https://github.com/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            checkedAt: new Date().toISOString(),
            present: {
              DIALOG_360_API_KEY: flag(process.env.API_KEY_PRESENT),
              DIALOG_360_WEBHOOK_SECRET: flag(process.env.WEBHOOK_PRESENT),
            },
            providerCalled: false,
            serverChanged: false,
          };
          async function api(method, endpoint, body) {
            const response = await fetch(`https://api.github.com/repos/${repo}/${endpoint}`, {
              method,
              headers: {
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
                'Content-Type': 'application/json',
              },
              body: body === undefined ? undefined : JSON.stringify(body),
              signal: AbortSignal.timeout(30000),
            });
            if (method === 'GET' && response.status === 404) return null;
            if (!response.ok) throw new Error(`GitHub: HTTP ${response.status}`);
            return response.json();
          }
          const previous = await api('GET', `contents/${file}?ref=${encodeURIComponent(branch)}`);
          await api('PUT', `contents/${file}`, {
            branch,
            message: 'docs(whatsapp): registrar presença dos secrets no Actions',
            content: Buffer.from(JSON.stringify(report, null, 2) + '\n').toString('base64'),
            ...(previous ? { sha: previous.sha } : {}),
          });
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `Resultado: https://github.com/${repo}/blob/${branch}/${file}\n`);
          if (!Object.values(report.present).every(Boolean)) process.exitCode = 1;
          NODE
