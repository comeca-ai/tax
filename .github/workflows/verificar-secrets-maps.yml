name: Verificar presença da configuração Maps

on:
  workflow_dispatch:

permissions: {}

jobs:
  verificar:
    if: github.repository == 'comeca-ai/projeto_tribureembolsa' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: homologacao
    steps:
      - name: Verificar presença sem consultar o provedor
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          POC_MAPS_ENABLED: ${{ vars.POC_MAPS_ENABLED }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const presente = Boolean(process.env.GOOGLE_MAPS_API_KEY?.trim());
          const habilitado = process.env.POC_MAPS_ENABLED === 'true';
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '# Presença da configuração Maps',
            `GOOGLE_MAPS_API_KEY: ${presente ? 'configurada' : 'ausente'}`,
            `POC_MAPS_ENABLED: ${habilitado ? 'habilitado' : 'desabilitado'}`,
            'Nenhuma chamada ao Google foi feita. Presença no GitHub não comprova provisionamento no servidor, validade da chave ou Routes API habilitada.',
          ].join('\n') + '\n');
          if (!presente) process.exitCode = 1;
          NODE
