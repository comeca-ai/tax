name: Qualidade

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: qualidade-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências imutáveis
        run: npm ci

      - name: Verificar lint
        run: npm run lint

      - name: Verificar tipos
        run: npm run check

      - name: Executar testes
        run: npm test

      - name: Testar configuração restrita de homologação (sem secrets/rede)
        run: node --test tools/deploy/whatsapp-homolog.check.mjs

      - name: Testar consulta somente leitura da 360dialog (respostas sintéticas)
        run: node --test tools/whatsapp/verificar-360dialog-readonly.check.mjs

      - name: Verificar segurança dos workflows
        run: node --test tools/github/workflows-security.check.mjs

      - name: Testar provisionamento isolado de integrações (sem secrets/rede)
        run: node tools/deploy/provisionar-integracoes-homolog.check.mjs

      - name: Gerar build de produção
        run: npm run build
