name: Qualidade

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: qualidade-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências imutáveis
        run: npm ci

      - name: Verificar lint
        run: npm run lint

      - name: Verificar tipos
        run: npm run check

      - name: Executar testes
        run: npm test

      - name: Testar configuração restrita de homologação (sem secrets/rede)
        run: node --test tools/deploy/whatsapp-homolog.check.mjs

      - name: Gerar build de produção
        run: npm run build
