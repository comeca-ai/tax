name: Provisionar integrações somente em homologação

on:
  workflow_dispatch:
    inputs:
      confirm_homolog:
        description: Aplicar credenciais em homologação e reiniciar somente homologação
        type: boolean
        required: true
        default: false
      change_reference:
        description: Referência da revisão e da publicação em homologação
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: configurar-whatsapp-homolog
  cancel-in-progress: false

jobs:
  provisionar:
    if: github.repository == 'comeca-ai/projeto_tribureembolsa' && github.ref == 'refs/heads/main' && inputs.confirm_homolog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: homologacao
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Verificar referência e ativação operacional
        env:
          ENABLED: ${{ vars.WHATSAPP_HOMOLOG_ENABLED }}
          CHANGE_REFERENCE: ${{ inputs.change_reference }}
        run: |
          node --input-type=module <<'NODE'
          if (process.env.ENABLED !== 'true' || !process.env.CHANGE_REFERENCE?.trim()) {
            console.error('Ativação ou referência de revisão ausente.');
            process.exit(1);
          }
          NODE
      - name: Validar protocolo e rollback com credenciais sintéticas
        run: node --test tools/deploy/provisionar-integracoes-homolog.check.mjs
      - name: Aplicar secrets conhecidos por SSH restrito
        env:
          CONFIRM_HOMOLOG: ${{ inputs.confirm_homolog }}
          DIALOG_360_API_KEY: ${{ secrets.API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.API_GOOGLE_MAPS }}
          API_NFE_IO: ${{ secrets.API_NFE_IO }}
          OPENAI_API_KEY: ${{ secrets.OPEN_AI_KEY }}
          HOMOLOG_SSH_PRIVATE_KEY: ${{ secrets.HOMOLOG_SSH_PRIVATE_KEY }}
          HOMOLOG_SSH_KNOWN_HOSTS: ${{ secrets.HOMOLOG_SSH_KNOWN_HOSTS }}
          HOMOLOG_SSH_HOST: ${{ vars.HOMOLOG_SSH_HOST }}
          HOMOLOG_SSH_PORT: ${{ vars.HOMOLOG_SSH_PORT }}
        run: node tools/deploy/provisionar-integracoes-homolog-send.mjs
