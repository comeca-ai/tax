name: Reescrever identidades de IA no histórico

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Digite REWRITE para confirmar a reescrita do histórico
        type: string
        required: true
      branch:
        description: Branch alvo para reescrita e force-push
        type: string
        required: true
        default: main
      dry_run:
        description: Simular sem aplicar alterações nem fazer push
        type: boolean
        required: true
        default: true
      target_email:
        description: E-mail final para Emerick (opcional)
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: rewrite-ai-identities-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validar confirmação explícita
        if: inputs.confirm != 'REWRITE'
        run: |
          echo "Entrada 'confirm' inválida. Use exatamente REWRITE." >&2
          exit 1

      - name: Obter histórico completo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/heads/${{ inputs.branch }}
          # Se a branch protegida exigir bypass de force-push, use HISTORY_REWRITE_TOKEN (PAT).
          token: ${{ secrets.HISTORY_REWRITE_TOKEN || github.token }}

      - name: Instalar git-filter-repo
        run: |
          python3 -m pip install --user git-filter-repo
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Auditar identidades atuais
        run: |
          echo '## Autor/Committer únicos'
          git log --format='%an <%ae>%n%cn <%ce>' | sort -u
          echo
          echo '## Trailers Co-authored-by únicos'
          git log --format=%B | grep -i '^Co-authored-by:' | sort -u || true

      - name: Reescrever identidades de IA para Emerick
        env:
          TARGET_NAME: Emerick
          TARGET_EMAIL: ${{ inputs.target_email || '' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: ./scripts/rewrite-ai-identities.sh

      - name: Push forçado da branch reescrita
        if: inputs.dry_run == false
        run: git push --force origin HEAD:${{ inputs.branch }}
