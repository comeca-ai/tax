# reembolsa.ia — Tax Engine | Stack completa self-hosted
# Uso: docker compose up -d --build
# App: http://localhost:3000 (ou http://SEU_IP:3000)
#
# NOTA: o serviço se chama `tax-app` (não `app`) de propósito — em servidores
# com proxy reverso (Caddy/Traefik) e rede compartilhada entre projetos, um
# serviço chamado `app` colide com o `app` de OUTRO projeto e o alias de rede
# passa a resolver para os dois containers em round-robin (site errado no ar).
# Se ligar este stack a uma rede externa de proxy, use o alias `tax-app`.
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_troque_isto}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-taxengine}
      MYSQL_USER: ${MYSQL_USER:-tax}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tax_troque_isto}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - tax-net

  tax-app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      APP_ID: ${APP_ID:-selfhosted}
      APP_SECRET: ${APP_SECRET:?defina APP_SECRET no .env (string longa e aleatória)}
      DATABASE_URL: mysql://${MYSQL_USER:-tax}:${MYSQL_PASSWORD:-tax_troque_isto}@db:3306/${MYSQL_DATABASE:-taxengine}
      # URL pública do app — usada no link de aceite do convite (v1.2.0).
      # Ex.: https://tax.suaempresa.com.br (sem barra final). Default: localhost:3000
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Convites por e-mail (opcional — sem SMTP_HOST o app mostra o link para copiar)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Webhook WhatsApp (opcional — fundação do bot, v1.2.0)
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      # OCR real (opcional): descomente e preencha
      # OCR_PROVIDER: vision
      # OCR_API_KEY: sk-...
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tax-net

networks:
  tax-net:
    name: tax-net

volumes:
  db_data:
